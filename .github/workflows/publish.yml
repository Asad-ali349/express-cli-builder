name: publish

# Publishes to npm when a GitHub release is published, with provenance.
# Uses npm trusted publishing (OIDC): no npm token is stored in this repository.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - name: Check that the release tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
      - run: npm publish --provenance --access public
